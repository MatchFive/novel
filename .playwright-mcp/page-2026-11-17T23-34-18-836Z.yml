        - heading "第 1 章 · 山门开时雪未落" [level=2] [ref=f1e1111]
        - generic [ref=f1e1112]:
          - paragraph [ref=f1e1113]: 天还没亮透，陆昭就出了村。
          - paragraph [ref=f1e1114]: 药篓子压在背上，里头是七包药，用油纸裹了两层，最上面搭了块旧麻布挡露水。他娘昨夜咳了半宿，他给煎了最后一服药，药渣没舍得扔，滤了滤又添水熬了第二遍，这会儿还在灶上温着。出门前他把灶膛的火压小了，留了半块饼在锅里，他娘要是起得来，自己热一下就能吃。
          - paragraph [ref=f1e1115]: 三十里山路，脚程快也要两个时辰。陆昭走惯了，脚底板踩在碎石上没什么感觉，倒是背篓的麻绳勒进肩窝，走一程就得换换肩。他换肩的时候会数路边的树，一棵两棵三棵，数到一百来棵就到外坊地界了。今天数到八十多棵的时候，天边才泛白。
          - paragraph [ref=f1e1116]: 外坊的药铺在街尾拐角，门脸不大，挂的幌子洗得发白。陆昭到的时候铺子刚卸门板，掌柜蹲在门槛上抽旱烟，见他来了，烟杆子往鞋底磕了磕：“来得倒早。”
          - paragraph [ref=f1e1117]: “怕耽误您开张。”陆昭把药篓卸下来，七包药一包一包摆在柜台上码齐。掌柜拿起来对着光看，又拆了一包捻了捻，点点头：“晒得干，没霉。”从抽屉里摸出几块铜板数了数，又犯难道，“这个月药材收得贵，脚力钱只能给这些。”
          - paragraph [ref=f1e1118]: 陆昭接过铜板，掂了掂，揣进怀里。
          - paragraph [ref=f1e1119]:
            - text: 掌柜蹲回去继续抽烟，抽了两口，像是想起来什么，弯腰从柜台底下摸出两包东西，纸包上落着灰：“上个月进的，搁忘了，有点走油，卖是卖不出去了，你拿回去，煎的时候多搁两碗水。”
            - 'button "← 问题台账 #0009" [ref=f1e1120] [cursor=pointer]'
          - paragraph [ref=f1e1121]: 陆昭接过来，纸包一入手就知道是熟地，分量不轻。他低头看了看纸包上的灰，用袖子擦干净，掀开衣襟，贴着里衣的兜肚兜进去，又按了按，才放下衣襟。那兜肚是他娘用旧布拼的，针脚粗，装东西倒是牢。
          - paragraph [ref=f1e1122]: “掌柜的，”陆昭把药篓背带往肩上顺了顺，“问您个事——青崖宗收徒，要不要钱？”
          - paragraph [ref=f1e1123]: 掌柜喷出一口烟，眼睛眯起来：“问这个做什么？”
          - paragraph [ref=f1e1124]: “随便问问。”
          - paragraph [ref=f1e1125]: “随便问问。”掌柜把烟杆子从嘴里拔出来，拿烟锅那头朝前街方向比了比，“今日十年开山，前街挤得跟下饺子似的，你打后街绕吧，这篓子别叫人踩了。测灵根倒是不要钱，可穷人家的孩子测了也白测，趁早回去砍柴是正经。”
          - paragraph [ref=f1e1126]: 陆昭没接这话。
          - paragraph [ref=f1e1127]: 他把药篓的背带在肩上紧了紧。掌柜把烟杆子往柜台上一搁，烟锅里的灰磕出来，拿脚尖碾了碾。
          - paragraph [ref=f1e1128]: “后街绕过去，多走半里地，就是巷子窄，你背个篓子不好过。”他拿烟杆朝街面那头点了点，“前街挤成什么样了，卖糖人的摊子都让人掀了，这会儿去，你这空篓子回来准成扁的。”
          - paragraph [ref=f1e1129]: 陆昭把药篓往背上顺了顺，麻绳在肩窝里卡进那道老茧里头。
          - paragraph [ref=f1e1130]: “听说了没有，十年一回，上回开山我还是壮年。”掌柜自己笑了一声，笑得没什么意思，拿手背蹭了蹭鼻子，“测灵根不要钱，你猜为什么不要钱？”
          - paragraph [ref=f1e1131]: 陆昭没猜。
          - paragraph [ref=f1e1132]: “因为测了也白测。”掌柜把柜台上一块抹布拎起来，抖了抖又搭回去，“有钱的早两年就请先生摸过骨了，灵根好的，人家私下里就递了帖子。放到前街上去排队的，都是去凑个热闹，回来还当自己错过了什么。你说穷人家的孩子，测出来个下下，回来砍柴都不安心。”
          - paragraph [ref=f1e1133]: 他这话说得随意，眼睛却瞟了陆昭一下。
          - paragraph [ref=f1e1134]: 陆昭把怀里那两包熟地又按了按，兜肚里的纸包硬邦邦地硌着胸口，凉气隔着里衣渗进来。
          - paragraph [ref=f1e1135]: “篓子我搁您门口，回来再取。”他说。
          - paragraph [ref=f1e1136]: 掌柜张了张嘴，烟杆子举到半空又落下来，看陆昭已经弯腰把空篓子靠墙根放稳当，背带绕了两圈挂在篓耳上，省得叫人踢了。
          - paragraph [ref=f1e1137]: “哎——”
          - paragraph [ref=f1e1138]: 陆昭已经转过身，朝前街那头走了。
          - paragraph [ref=f1e1139]: 掌柜在后头喊了句什么，街上人声涌过来，把那话冲散了。陆昭没回头。前街比掌柜说的还挤。
          - paragraph [ref=f1e1140]: 陆昭从巷口一拐进去，迎面就是一股人身上的热气，混着汗酸、脚泥、还有炸油糕的油腥味。街两边摊子确实被挤得歪七扭八，一个卖糖人的老汉把摊子挪到墙根，整个人护着那根草把子，草把子上插的糖兔子被碰掉两只，掉在地上，转眼就叫人踩碎了。
          - paragraph [ref=f1e1141]: 人堆里什么打扮都有。有跟他一样背着篓的，有挑着空担子的，有穿半新不旧短褂的，也有几个衣裳料子明显好些的，袖口滚着边，站在人堆外头拿帕子捂鼻子。陆昭贴着墙根往前挪，空药篓的背带攥在手里，篓子悬在身侧，省得叫后头人踢翻。
          - paragraph [ref=f1e1142]: 测灵台搭在前街尽头的空场上，说是台，其实就是三层青石垒起来的一个方台子，台面铺了整块灰白石头，石头上搁着块半人高的青石条，石条顶面磨得发亮，在日头底下泛着一层油润的光。台下乌泱泱排着人，队伍尾巴甩到街口，弯了两道弯。陆昭找了个队尾站定，前头是个剃了半瓢头的半大孩子，正踮脚往前看，后头紧跟着又站了人，把他夹在中间。
          - paragraph [ref=f1e1143]: 队伍挪得慢。陆昭把药篓换到左手拎着，右手在衣襟上蹭了蹭掌心的汗。往前看，台上那个测灵弟子穿一身灰蓝袍子，袖口扎得利索，嗓子已经喊哑了，说话像砂纸磨铁：“手按上去，按实了，别虚着——下一个。”
          - paragraph [ref=f1e1144]: 前面那个汉子把手往青石条上一覆，石面先是什么动静都没有，过了两三息的工夫，才泛起一层薄薄的白光，白光晃了晃就散了。测灵弟子瞥了一眼，朝旁边一摆手：“过，下一个。”
          - paragraph [ref=f1e1145]: 汉子愣着没动：“这、这算过了？”
          - paragraph [ref=f1e1146]: “白灵根，下品，记上了，站那边等着。”测灵弟子已经去看后头的人了。
          - paragraph [ref=f1e1147]: 汉子从台上下来，脸上的表情说不清是笑还是没笑，被个戴帽子的执事引到台侧一小片空地上，那儿已经站了十来个被录下的，有站得笔直的，也有蹲在地上拿手抠鞋帮子的。
          - paragraph [ref=f1e1148]: 又上去一个穿细布衫的少年，手按石条，石面上亮起一道青碧色的光，比方才的白光扎实，在石面上停了好几息才淡下去。台下有人伸脖子。测灵弟子转头朝台侧喊了一声：“碧灵根，中上，记了。”那边执事应了一声，拿笔在册子上画了一下。少年下来的时候背挺得直，走过人群时有人让了让。
          - paragraph [ref=f1e1149]: 再往后，什么颜色的光都见了。有个瘦得肋骨能数的丫头按上去，石面闪了一下黄光，测灵弟子说“黄灵根，下等，外门杂役候着”，丫头被引到另一边，跟先前那拨没录上的站一处。有个胖子手按上去，石条半天没亮，测灵弟子拿手背敲了敲石面，胖子又使劲按了一回，这回亮了，颜色灰扑扑的，测灵弟子皱了皱眉：“驳杂，下下。”胖子还想说什么，后头人已经把他挤开了。
          - paragraph [ref=f1e1150]: 陆昭往前挪了两步。
          - paragraph [ref=f1e1151]: 他前头那半瓢头孩子回头看了他一眼，见他拎着个空篓子，问：“你也来测？”
          - paragraph [ref=f1e1152]: “嗯。”
          - paragraph [ref=f1e1153]: “你什么灵根知道不？”
          - paragraph [ref=f1e1154]: “不知道。”
          - paragraph [ref=f1e1155]: 半瓢头孩子撇了撇嘴，转回去，又踮脚往前看。
          - paragraph [ref=f1e1156]: 太阳爬到头顶，晒得后脖颈发烫。陆昭把药篓换回右手，左胳膊垂着甩了甩。前头又录了几个，赶走的比录上的多。有个老婆子领着孙子来，孙子按了半天石条不亮，老婆子跟测灵弟子求情，说孩子爹娘都没了，家里就这一根苗，测灵弟子把她的手扒拉开，喊下一个，老婆子被后头的人挤到边上，站了一会儿，领着孙子走了。
          - paragraph [ref=f1e1157]: 陆昭看见那孩子走的时候回头看了一眼台上的青石条。
          - paragraph [ref=f1e1158]: 队伍往前挪了半截，前头半瓢头孩子忽然回头问他：“你要测出来个下下，回去不？”
          - paragraph [ref=f1e1159]: 陆昭盯着台上那块石头，说：“看。”
          - paragraph [ref=f1e1160]: “看什么？”
          - paragraph [ref=f1e1161]: “看他们要不要人干活。”
          - paragraph [ref=f1e1162]: 半瓢头孩子没听懂，挠了挠后脑勺，转回去了。
          - paragraph [ref=f1e1163]: 台上又亮了一回光，这回是赤红色，在石面上跳了两跳，测灵弟子难得抬了抬眼皮：“赤灵根，中等，站那边。”台下那个少年自己先愣了，被他娘在后头推了一把才醒过神，同手同脚地往台侧走，走过人堆的时候有人拍他肩膀，他咧着嘴笑，露出两颗豁牙。
          - paragraph [ref=f1e1164]: 陆昭跟着队伍又往前挪了几步。已经能看清台面上青石条上的纹路了，石条边上缺了个小角，像是磕的。测灵弟子灌了口水，拿袖子抹了把嘴，喊：“下一个——”
          - paragraph [ref=f1e1165]: 他前头只剩十来个人了。前头只剩七八个人了。陆昭把空药篓往脚边一放，篓底磕在石板上，咚的一声。半瓢头孩子回头看他一眼，陆昭没动，眼睛盯着台面上那块青石条，条面上磨得发亮的顶面映着日头，缺角那儿积了一点灰。
          - paragraph [ref=f1e1166]: “下一个——”
          - paragraph [ref=f1e1167]: 前头那人上去按了，石条亮了道暗红，测灵弟子说赤灵根下等，往杂役那边指。再一个，按上去没动静，又按，还是没动静，测灵弟子拿指节在石条上叩了两下，那少年急得脸涨红，两只手一起覆上去，石面灰蒙蒙地闪了一闪，测灵弟子摆摆手：“驳杂，下下，让开让开。”
          - paragraph [ref=f1e1168]: 陆昭前头只剩三个了。
          - paragraph [ref=f1e1169]: 半瓢头孩子上去了。他把手往石条上一按，按得挺实，石面过了好一会儿才泛起一层浅黄，晃晃的，不太稳。测灵弟子看了一眼，说黄灵根下等，站那边。半瓢头孩子下来的时候脚尖踢着台阶边，差点绊一跤，回头瞅了陆昭一眼，嘴唇动了动，没说出什么，被后头人一挤就挪到杂役那堆里去了。
          - paragraph [ref=f1e1170]: “下一个。”
          - paragraph [ref=f1e1171]: 陆昭拎起药篓，跨上台阶。三层青石，最后一级比前头高些，他抬脚的时候裤腿扫过石棱，蹭了一道灰印子。台上风大些，吹得他后脖颈上那层汗凉了。测灵弟子嗓子已经劈了，抬下巴朝他示意：“手，按实。”
          - paragraph [ref=f1e1172]: 陆昭把药篓搁在脚边，弯腰，两只手掌覆上青石条顶面。石面是温的，被日头晒了一上午，掌心贴上去能感觉到底下细密的颗粒。他按实了，没虚着。
          - paragraph [ref=f1e1173]: 等了两三息，石面上浮起一点光。灰的，又泛点黄，中间夹一丝极淡的青，像雨后水洼里搅浑了的泥色，亮了一亮，还没来得及看清就暗下去了，比方才那个胖子的还快。石条顶面上只剩一层水汽似的薄翳，几息工夫就散干净了。
          - paragraph [ref=f1e1174]: 测灵弟子拿手背在石条边上敲了敲，又看了一眼石面，回头朝台侧喊：“周执事，您来看一眼。”
          - paragraph [ref=f1e1175]: 台侧走过来一个人。灰袍，腰上系一条旧革带，带扣磨得发白，手里捏着本翻得卷了边的名册。周秉走到台前，低头扫了一眼石面，那层杂色已经散得只剩一点痕，他也没再叫陆昭重按，翻开名册拿笔杆在某一页上点了点，当众开口，声音不高，但台下排着队的人都听得见：
          - paragraph [ref=f1e1176]: “灵根驳杂，下下。”
          - paragraph [ref=f1e1177]: 他把名册合上，笔杆朝台下一挥：“让开，下一个。”
          - paragraph [ref=f1e1178]: 台下有人唔了一声，说不清是叹气还是笑。陆昭把手从石面上收回来，掌心留着石条的余温，还有一层细细的灰。他弯腰拎起药篓，退到台沿，脚后跟碰到台阶边才停住。测灵弟子已经朝队伍后头喊了下一个，一个穿青布衫的少年从他身边挤过去，肩膀撞了他一下。
          - paragraph [ref=f1e1179]: 陆昭侧了侧身，把药篓换到左手，右手在裤腿上蹭了蹭掌心的灰，低头看了一眼台侧的杂役那一堆人。半瓢头孩子蹲在最边上，拿手指头在地上画圈，画了两笔又抹了。陆昭退到台沿，药篓换到右手拎着，指头勾着篓绳，没急着走。台侧的杂役堆里半瓢头孩子还蹲着，抬头朝他这边望了一眼，又低下去了。
          - paragraph [ref=f1e1180]: 人群后头让开一条道，走过来三个人。
          - paragraph [ref=f1e1181]: 打头那个穿一身靛青直裰，料子簇新，袖口压着两道暗纹滚边，腰间悬一块青玉牌，走一步晃一下。后头两个跟班，一左一右，年纪都差不多，手里各提着个布包，看那坠手的形状里头是礼盒。
          - paragraph [ref=f1e1182]: 前头排队的见了这阵势自动往两边缩，让出来的道刚好够三个人并排走。靛青直裰走过测灵台前，脚步不停，偏头朝台面上那块青石条扫了一眼，嘴角撇了撇，脚步就慢了。
          - paragraph [ref=f1e1183]: “这种资质也来占位置。”
          - paragraph [ref=f1e1184]: 他声音不大，但前街这块地方挤得密，话一出口，前后几排人都听见了。有几个人跟着笑，笑得短，笑完了又都各自看别处。
          - paragraph [ref=f1e1185]: “后山砍柴缺人，”靛青直裰把腰牌摘下来在手里掂了掂，“砍够了兴许还能混口饭吃，比站这儿体面。”
          - paragraph [ref=f1e1186]: 跟班里左边那个接得快：“裴师兄说得在理。”
          - paragraph [ref=f1e1187]: 右边那个跟着点头，点得比说话那个还勤。
          - paragraph [ref=f1e1188]: 陆昭把药篓从右手换回左手，篓绳在掌心勒了一道红印。他没抬头看那三个人，视线落在自己脚边那块青石板上——石板缝里嵌着半截草茎，被人踩扁了，贴着缝长。裴照从他身前走过去，衣摆带起一阵风，袖口滚边从他药篓边上擦过去，篓子晃了晃。
          - paragraph [ref=f1e1189]: 三个人走远了。前街那头有人迎上来，弯腰跟裴照说话，裴照没停脚，直裰后摆一掀一掀的，青玉牌在腰侧撞出细碎的响。
          - paragraph [ref=f1e1190]: 周围的笑声散了。测灵弟子清了清嗓子，朝队伍后头喊下一个，队伍又慢慢往前挪。
          - paragraph [ref=f1e1191]: 陆昭站着没动，等前头挤过去三四个人，才转过身，走到台侧周秉跟前。周秉正低头往名册上记东西，笔杆夹在指缝里，另一只手翻页，翻得急，有一页差点撕了角。
          - paragraph [ref=f1e1192]: “周执事。”
          - paragraph [ref=f1e1193]: 周秉抬眼，眉头拧着，认了两息才认出他来：“驳杂那个——让开了就让开了，后头还有人排着。”
          - paragraph [ref=f1e1194]: “杂役还缺人么。”
          - paragraph [ref=f1e1195]: 周秉翻名册的手停了。他盯着陆昭看了两息，笔杆在名册边沿上磕了两下，磕掉笔尖上一点墨渣。
          - paragraph [ref=f1e1196]: “你方才没听见我说？”他把名册往回翻，翻到前头一页，指头戳着上头密密麻麻的名字，“杂役不白当，得先过入门关。过得了再说。”
          - paragraph [ref=f1e1197]: 陆昭朝那页上看了一眼，名字挤得密，有的划了黑杠，有的还没划。他没再问，把药篓往肩上背带里一穿，转身走了。
          - paragraph [ref=f1e1198]: 周秉在后头又补了一句：“午后自己到山门下去，过时不等。”
          - paragraph [ref=f1e1199]: 声音追着后脑勺过来，陆昭抬了抬手，没回头，算是应了。午后雨来得急，前一息日头还挂在西边山脊上，下一息山门那边的天就压下来了，灰蒙蒙一片往这边推。前街收摊的快，竹棚子一顶顶卷起来，卖吃食的挑子往巷子里撤，地上遗着几片烂菜叶和碎纸，叫雨点子一打，全贴在青石板上。
          - paragraph [ref=f1e1200]: 陆昭到山门下的时候，雨已经落密了。山门是两座石墩夹一道铁栅，石墩上刻着青崖宗的字号，字槽里积着水，顺着笔画往下淌。栅子后头是一条往上去的石阶，雨雾把上头的路遮了，看不见顶，只见石阶一层叠一层往上钻，两侧老松被雨打得直往下滴水。
          - paragraph [ref=f1e1201]: 石墩底下已经站了十来个人。大半是前街测灵没过的，也有几个没赶上测的，缩着脖子挤在铁栅边上躲雨。早上那个半瓢头孩子也在，蹲在栅子根儿，拿一根草茎戳地缝里的水，水一冒出来就拿草茎去堵，堵了又冒，也不嫌烦。
          - paragraph [ref=f1e1202]: 周秉从山门里出来，没打伞，灰袍肩头洇出一片深色。他手里还是那本名册，腋下夹着，腾出一只手把铁栅拉开半扇，人往石墩边上一站，也不招呼，等底下的人自己围过来，才开口。
          - paragraph [ref=f1e1203]: “都愿意试杂役？”
          - paragraph [ref=f1e1204]: 几个人应了，有几个只点头。周秉拿名册在石墩上拍了拍，拍掉封皮上的雨水，往后翻了几页。
          - paragraph [ref=f1e1205]: “规矩先说清楚。这阶叫问心阶，往上三百来级。阶上摆着石头，每块石头上刻一个名。”他抬下巴朝石阶方向指了指，“找到刻你名字的那块，背上，一级一级往上走。半道把石头撂了，就是撂名字，守阶的记一笔，你趁早下山，不用再往上费脚力。背到顶，才算过了这一关。”
          - paragraph [ref=f1e1206]: 底下有人小声问：“石头多重？”
          - paragraph [ref=f1e1207]: “不轻不重，你自己掂了就知道。”周秉把名册往腋下一夹，“别想着半道换石头、搭伴抬，守阶的都长着眼睛。还有——石头上那个名，雨浇不掉，刀刻的，别拿指甲去抠。”
          - paragraph [ref=f1e1208]: 半瓢头孩子从地上站起来，裤腿湿了半截，仰头问：“抠了咋说？”
          - paragraph [ref=f1e1209]: 周秉低头看了他一眼：“抠了就是没名，没名你背什么上去？”
          - paragraph [ref=f1e1210]: 孩子缩了缩脖子，不问了。
          - paragraph [ref=f1e1211]: 陆昭站在人堆靠后，雨顺着药篓背带往下淌，篓子早空了，轻飘飘挂在肩上。他没往周秉跟前凑，听一句记一句，眼睛顺着铁栅后头那道石阶往上看。石阶湿得发亮，中段有一两块横着的青石，隔几级摆一块，那就是要背的东西。
          - paragraph [ref=f1e1212]: 周秉把名册交给栅子边一个年轻弟子。那弟子看着比陆昭大不了几岁，一身青灰短打，腰间别着块木牌，手里捧的正是那本名册，翻开的，上头一行一行写着名字，有的名字旁边已经画了黑杠。他把名册往胳膊弯里拢了拢，抬眼扫底下这一圈人。
          - paragraph [ref=f1e1213]: “我姓何，守阶的。”那弟子说话比周秉还少，一句是一句，“你们上去，我在后头跟着。谁撂石头我划谁名，别跟我磨嘴皮子，磨也没用。”
          - paragraph [ref=f1e1214]: 周秉那边已经转身往山门里走了，走了两步又停下，回头补了一句：“试归试，丑话说前头——杂役不算弟子，没月例，管饭，住柴房后头那排通铺。想清楚了再上。”
          - paragraph [ref=f1e1215]: 没人走。
          - paragraph [ref=f1e1216]: 周秉也没再看，袖子一甩进了山门。铁栅拉开着，雨从栅子缝里斜打进来，石阶下这一小块地方反倒比外头干些。陆昭把药篓从肩上摘下来，搁在石墩根儿，篓绳绕了两圈系在背带上——上去是不能再背这个空篓子了，捆在阶底下，回头还来拿。
          - paragraph [ref=f1e1217]: 那个姓何的守阶弟子已经先一步上了石阶，站在第三级上，名册搭在臂弯，回头等底下的人动。
          - paragraph [ref=f1e1218]: 半瓢头孩子第一个钻过铁栅，脚底下一滑，扶住石墩才站稳，回头朝陆昭看了一眼。陆昭朝他点了一下头，自己跟上去，脚踩上第一级石阶，鞋底和湿石头一碰，凉气从脚心往小腿上钻。陆昭把药篓在石墩根儿捆好，直起腰，雨顺着后颈流进衣领里。铁栅后头那道石阶往上铺，每块青石上都磕着字，雨浇得字槽里汪着水，白亮亮的，隔远了看像石头上长了一排排眼睛。
          - paragraph [ref=f1e1219]: 他走上第三级，蹲下去看离自己最近的那块。石面比寻常条石厚实些，四角磨得圆钝，刻的字在靠阶沿那一侧，楷体，笔画里有青苔填着。他拿袖子擦了一把，看清了，不是自己的名，又往上走。
          - paragraph [ref=f1e1220]: “陆昭——”
          - paragraph [ref=f1e1221]: 前头有人喊。是守阶那个姓何的弟子，站在第七级上，名册搭在臂弯，拿手指头在阶沿上磕了两下：“这块。”
          - paragraph [ref=f1e1222]: 陆昭上去。石头跟前面那块差不多大小，刻着“陆昭”两个字，横平竖直，笔画里还塞着湿泥。他蹲下来，两手扣住石底，先没急着搬，掂了掂——往起提了两寸，松手，石头落回阶上，闷闷一声。他换了个姿势，左腿半跪，拿肩膀顶住石侧，往上一送，石头离了阶面，腰里跟着一沉。
          - paragraph [ref=f1e1223]: “行不行啊？”旁边有个少年探头看，手里还空着，显然没找着自己的石头，“这玩意儿我试了，少说四十斤。”
          - paragraph [ref=f1e1224]: 陆昭没答话。他把石头挪到底下一级，搁在膝上，腾出手去解腰带。腰带是粗麻的，他娘搓的，编得紧实，系了个活扣。解开之后他从石底穿过去，两头绕回胸前，使劲一收，石头贴上了后背，勒得他喘气短了一截。
          - paragraph [ref=f1e1225]: “啧，你还真绑啊。”那少年看不下去了，冲姓何的弟子那边扬了扬下巴，“何师兄，这石头也太沉了，我那个比他的还大一圈，能不能换？”
          - paragraph [ref=f1e1226]: 姓何的弟子头都没抬，手指头点着名册。
          - paragraph [ref=f1e1227]: “换不了。上头刻着你的名，换一块名就错了。”
          - paragraph [ref=f1e1228]: “那、那划小点不行吗？我就削个角。”少年说着已经蹲下去，从腰里摸出把柴刀，刃口在石角上比了比。
          - paragraph [ref=f1e1229]: 何师兄这才抬眼，把名册翻过一页，手指头在某一栏上停住：“你叫刘石头？”
          - paragraph [ref=f1e1230]: “哎。”
          - paragraph [ref=f1e1231]: “再削一下试试。”
          - paragraph [ref=f1e1232]: 柴刀停在半空。刘石头回头看看阶下，又看看何师兄那张没表情的脸，把刀收了回去。何师兄从怀里摸出根炭条，在名册上那个名字后头画了一笔——陆昭没看清画的是什么，只看见那笔画下去，刘石头脖子根儿红了一片。
          - paragraph [ref=f1e1233]: “画了？”刘石头凑过去看。
          - paragraph [ref=f1e1234]: “画了。”何师兄合上名册，“嫌沉可以下山，不用背了。”
          - paragraph [ref=f1e1235]: “我没说不背——”刘石头急了，把柴刀往腰里一别，蹲下去抱自己那块石头，抱了两下没抱动，拿膝盖顶住石底往起掀，石头翻了个个儿，砸在阶上咚一声，溅起一片泥水。
          - paragraph [ref=f1e1236]: 陆昭站在旁边，腰带在胸前又紧了一道。石头的分量压着他后背，脚跟踩在湿石阶上，脚趾头在鞋里抠着。他往上走了两步，回头看了一眼刘石头。刘石头正把石头往背上驮，驮一半往下滑，又驮，嘴里嘟囔着什么听不清。
          - paragraph [ref=f1e1237]: “走不走？”何师兄已经上了两级，回头问。
          - paragraph [ref=f1e1238]: 陆昭把重心往前压了压，一步踩上第八级，石头在背上晃了一下，腰带勒进肩窝。他拿手在带子上别了一把，叫它卡住，没回头。雨没有要歇的意思，反倒比刚才更密了，打在石阶上溅起一层白雾，三两级以外的人影就有些糊。陆昭低着头，眼睛只放在脚前那块青石上，鞋底踩稳了再换另一只脚。石头压在背上，腰带勒进肩窝里，每上一级，那分量就往下坠一坠，像有人拿手按他后颈。
          - paragraph [ref=f1e1239]: 前头的人走得比他快。一个瘦高个儿走到半阶那儿，忽然站住了，弯下腰，把背上的石头往阶沿上一搁，两手撑着膝盖喘。他搁石的动作很轻，还拿脚尖把石头往边上拨了拨，怕挡了旁人的路——可搁下就是搁下了。
          - paragraph [ref=f1e1240]: 守阶弟子跟上来，脚步不急，名册在臂弯里夹着，炭条已经捏在手里。他走到那块石头跟前，低头看了一眼石面上的名，又看一眼那瘦高个儿，什么也没说，炭条在名册上一划。那一声划纸的响动其实不大，可周围几个人都听见了，脚步不约而同地顿了顿。
          - paragraph [ref=f1e1241]: 瘦高个儿张了张嘴：“我、我就歇口气——”
          - paragraph [ref=f1e1242]: “歇你的。”守阶弟子把炭条收回去，“石头搁这儿，人随便歇。”
          - paragraph [ref=f1e1243]: 瘦高个儿愣在那儿，手还撑着膝盖，过了两息才直起腰，脸上的水不知道是雨还是别的什么。他没再往上看，也没捡石头，侧着身子从阶边挤下去，往下走了。擦过陆昭身边的时候，两个人的肩膀碰了一下，瘦高个儿没抬眼，陆昭也没停。
          - paragraph [ref=f1e1244]: 再往上，又有人丢石。这回是个矮胖的少年，把石头往阶上一墩，咚的一声闷响，比瘦高个儿那下重得多。守阶弟子的炭条跟过去，划了。矮胖少年倒没走，蹲在自己那块石头旁边，拿手抹脸上的雨，嘴里嘟囔了一句什么，听不清，守阶弟子也没搭理他，只管往上走。
          - paragraph [ref=f1e1245]: 陆昭从矮胖少年身边过的时候，脚下踩到一块活动的碎石，身子歪了一下，背上的石头跟着往左坠。他赶紧把腰往右拧，右脚抢上半级台阶，脚跟一落，稳住了。石头在背上晃了晃，腰带勒得他吸了口气，凉气混着雨腥味灌进嗓子眼。
          - paragraph [ref=f1e1246]: “慢着点。”前头不知谁喊了一声，声音被雨打得散，“这石头一滑，砸着后头的人算谁的？”
          - paragraph [ref=f1e1247]: 没人接话。陆昭也没抬头，只把两脚站得更开些，一级一级往上踩。石阶上汪着的水被前面的人踩开了，又聚起来，他每踩一脚，鞋底和石面之间就挤出细细一道水线，顺阶沿往下淌。
          - paragraph [ref=f1e1248]: 守阶弟子已经走到更高处了，背影在雨里小了一圈。名册上划掉的几笔，陆昭不知道记了几个，他只看见前头丢石的，一个接一个，阶沿上零零散散搁了好些块青石，刻着名的那面朝上，雨水把字槽灌满了，白亮亮的，跟底下那排没搬上来的石头一个样。
          - paragraph [ref=f1e1249]: 陆昭脚下没停。石头压得他腰往下弯，他就把下巴收一收，眼睛还盯着脚前。数到第十四级的时候，他换了一口气，把肩往上一耸，石头颠了颠，重新贴回背上，腰带又勒紧了些。雨顺着额角往下淌，进了眼睛，他眨了两下，没拿手去抹，那只手得按着腰带，怕松了扣。石阶到中段，坡度陡了一截。
          - paragraph [ref=f1e1250]: 陆昭右脚踩上第二十三级，鞋底在石面上打了个滑——那石面叫雨浇了半个时辰，青苔泡得发胀，踩上去跟踩了层油似的。他脚下一空，整个人往前栽，背上的石头跟着往前一坠，腰带勒进肩窝勒得他嗓子眼发紧。他想拿手去撑，手还按着腰带扣，没来得及松开，膝盖先磕在阶沿上，磕得闷响一声，石头从背上翻过去，连人带石滚下去两级。
          - paragraph [ref=f1e1251]: 滚的时候他听见石头砸在石阶上的响动，咚、咚，磕了两下才停。他自己的肩头撞在下一级的阶角，那阶角是块缺了口的青石，棱子钝，可撞上去还是叫他一口气憋在胸口没上来。
          - paragraph [ref=f1e1252]: 雨打在身上，他趴了两息才缓过劲。膝盖那地方火辣辣的，肩窝也疼，拿手一摸，摸到一手的血，叫雨一冲就淡了，顺着指缝往下淌。他撑着阶面坐起来，低头看自己的膝盖，裤子磨破了一块，破口底下皮肉翻着，混着泥沙。肩头那道口子更深些，衣裳叫血洇黑了一块，边缘叫雨泡得发白。
          - paragraph [ref=f1e1253]: 石头摔在旁边两级台阶下头，侧翻着，刻名的那一面朝上。陆昭爬过去看，字槽里灌了泥，泥是山下带上来的黄土，叫雨冲得稀了，糊在“陆昭”两个字上头，笔画都看不大清。他拿袖子去擦，袖子也是湿的，一擦把泥抹得更匀了，那两个字的轮廓整个糊成一团。
          - paragraph [ref=f1e1254]: 他蹲在雨里，手撑着膝盖喘气。
          - paragraph [ref=f1e1255]: 前头有人往下瞥了一眼，脚步没停。何师兄站在上面几级的地方，名册夹在胳膊底下，炭条捏在手里，看着他，也没有说话。雨声里听不真切别的动静，只听见阶上有人踩着水往上走的响。
          - paragraph [ref=f1e1256]: 陆昭又喘了两口，把嘴里的雨水吐了。肩窝的血顺着手臂往下淌，滴在石阶上，先是一小滩，叫雨冲开，淡成一条细线往阶沿流。他拿手按着肩头，按了一会儿，血从指缝里还在往外洇。
          - paragraph [ref=f1e1257]: 石头上的泥还没擦干净。陆昭蹲在雨里，拿手背蹭了一下鼻子，蹭下来一手的泥水。石头侧翻在下面两级，他够不着，得挪过去。他把按着肩头的那只手松开，血顺着手臂内侧淌到肘弯，凉丝丝的，叫雨一冲就散。膝盖上的破口叫雨水浸着，一跳一跳地疼，倒比肩窝好受些，肩窝那道口子像是给人拿钝刀子在里头翻了一下。
          - paragraph [ref=f1e1258]: 他爬过去，两条腿先下，屁股蹭着湿石面滑到下一级，再一级。石头就在脚边，刻名那面朝上，泥糊得匀匀的，他拿手抠了两下，指甲缝里塞满黄泥，字还是看不出来。算了。他把石头翻了个面，刻字那面朝下扣在背上，反正名册上记得有，石头认不认字不要紧，人认路就行。
          - paragraph [ref=f1e1259]: 腰带是从腰上解下来的，粗麻的，两头磨得起毛。他把石头往背上驮，驮到一半石头往下坠，他赶紧拿肩膀顶住，右膝跪在台阶上吃住力，膝盖底下的破口叫石面一硌，疼得他呲了下牙。腰带绕过石头，从胸前兜过来，再绕回石头底下，他一只手按着石头顶，另一只手把腰带两头往一块儿扯。绳头滑，手也滑，雨把麻绳泡软了，第一道扣没吃住力，他一扯就散了。他把绳头在石棱上蹭了两下，蹭掉点水，重新绕。第二道他拿牙咬着绳头，两手把腰带往石头上勒，勒到石头贴住脊背了，牙一松，绳头弹回去，他赶紧拿手攥住。这回打了个死结，勒得紧，石头嵌进背里，腰带从肩窝那道口子边上压过去——正压在上头，他肩头一抽，血从布底下洇出来，把腰带那一截染成深色。
          - paragraph [ref=f1e1260]: 他扶着阶沿站起来。阶沿是块整石，没棱没角，手按上去滑，指头使不上劲，他拿掌根卡住石沿，先撑起一条腿，再撑另一条。站起来的时候腰没直，石头坠着，直不起来，就那样半弓着。
          - paragraph [ref=f1e1261]: 何师兄还站在上头几级，名册夹在胳膊底下，炭条没动。陆昭抬头看了一眼，何师兄也看他，两个人都没说话，雨声把中间那几级台阶填得满满的。何师兄把炭条从名册上拿下来，捏在手里转了一圈，又夹回去了。
          - paragraph [ref=f1e1262]: 陆昭抬脚往上走。
          - paragraph [ref=f1e1263]: 石头比先前沉。不是分量沉了——分量没变，是腰上多了一道死结，勒得他喘气都得挑时候。他每上一级，石头在背上颠一下，死结就跟着往肉里紧一紧，肩窝的血渗得慢，一格一格地洇。他把下巴颏往胸口收，下巴尖抵着胸骨，眼睛只盯脚前那半尺见方的石面，数着台阶往上走。第二十四级，第二十五级。
          - paragraph [ref=f1e1264]: 前头那个蹲着的少年挡在道中间。瘦，比陆昭还瘦一圈，石头搁在脚边，两只手揉着右小腿肚子，揉一下吸一口气，吸得跟抽风箱似的。他听见背后脚步响，偏过头来看，脸上雨汗混着，头发贴在额角上，一绺一绺的。
          - paragraph [ref=f1e1265]: “你往上走的？”少年问了句，话里头带着喘。
          - paragraph [ref=f1e1266]: 陆昭没停脚，从少年左边绕过去。少年往边上挪了挪膝盖让路，手还按在小腿上，嘴里嘟囔：“这破石阶，比我家后坡还难走。”他低头看陆昭背上那块石头，刻名那面朝下，泥水顺着石棱往下滴，“你这石头……掉过了？”
          - paragraph [ref=f1e1267]: 陆昭脚下踩着第二十八级，左脚换右脚，没回头：“掉过。”
          - paragraph [ref=f1e1268]: “那你还背？”
          - paragraph [ref=f1e1269]: 陆昭把右脚踩实了，石头在背上颠了一下，死结勒得他吸了口气，把气咽回去才开口：“名在上头。”
          - paragraph [ref=f1e1270]: 少年没再问，手在小腿上又揉了两把，抬头看上面剩下那截石阶，阶面叫雨浇得白亮亮的，一级一级往高处收，收进雨幕里头看不见头。他把嘴抿了抿，手撑在膝盖上，看样子是要站起来。
          - paragraph [ref=f1e1271]: 陆昭已经过了他两级。雨打在后颈上，顺着脊梁沟往下淌，淌到腰带那儿叫死结挡住了，积了一小洼水，凉得他腰眼一缩。他没管，眼睛盯着前面第三十级的石棱，那石棱缺了个口，缺得跟底下磕着他肩头的那块一个样。他把左脚踩上去，踩稳了，再把右脚提上来。雨从斜里打过来，石阶上那层水膜叫风一吹，泛起细密的纹，一级一级往上看，白亮亮地晃眼。上段比底下陡，石阶也窄些，脚横着放才踏实，石头在背上坠着，人得往前倾才站得住，陆昭腰弯得厉害，下巴快贴到膝盖上，后颈露在雨里，凉得那根筋一抽一抽地跳。
          - paragraph [ref=f1e1272]: 上头有人坐在阶上。一个穿灰短褐的，背靠着上两级台阶，两条腿伸得直直的，石头搁在脚边，脑袋垂着，雨顺着发梢往下滴，也不知道是歇气还是走不动了。再往上五六级，又一个，侧身坐着，一只手搭在石头上，眼睛往下看，看得挺专心的，底下那段阶上还有人在往上挪。他看得见，陆昭也看得见，可那人不喊，也不搭手，就那么坐着看。
          - paragraph [ref=f1e1273]: 陆昭从灰短褐身边过的时候，那人抬了抬眼皮。
          - paragraph [ref=f1e1274]: “还有多少级？”
          - paragraph [ref=f1e1275]: 陆昭没停，脚踩实了下一级才答：“没数。”
          - paragraph [ref=f1e1276]: “我数了。”灰短褐把手从膝盖上拿下来，往阶上比了比，“从底下到这儿一百一十七，上头还看不见头。”他说这话的时候嗓子哑得厉害，像吞过砂子，“我坐一会儿。就一会儿。”
          - paragraph [ref=f1e1277]: 陆昭没接话，腰上那道死结勒得他肋下疼，每上一级石头在背上颠一下，死结就松半分，松了他就拿胳膊肘往后顶一顶，把石头正回原位。又上了七八级，听见前头那个侧身坐着的开了口，跟谁说话呢，陆昭抬头看，那人是对着阶底下喊的：“别背了，搁下吧——搁下又不吃人。”
          - paragraph [ref=f1e1278]: 底下有人回了一句什么，叫雨声搅散了，听不真切。侧身坐着的那个把石头往脚边一推，石头在阶面上蹭出半尺，“我搁这儿了。名册上爱划不划，我腿肚子转筋了。”
          - paragraph [ref=f1e1279]: 守阶的弟子从底下上来，名册夹在胳膊底下，走到侧身坐着的跟前，炭条在名册上划了一道，划完了也没说话，绕过去接着往上走。侧身坐着的那个把脸扭到一边，看阶外头的雨。
          - paragraph [ref=f1e1280]: 陆昭把脚踩到第一百二十三级的石棱上，那条棱缺了个口，缺得跟肩头磕过的那个一个样，他把脚掌横过去卡住缺口，才把后脚提上来。石头压得他腰眼发酸，酸得他龇了下牙，嘴里灌进一口雨，凉的，带着石头上那股青灰的腥气。他把那口气咽下去，接着抬脚。
          - paragraph [ref=f1e1281]: 第一百二十四。一百二十五。
          - paragraph [ref=f1e1282]: 前头灰短褐还在原处坐着，这回没抬头。陆昭从他右边绕，脚底下踩得比方才稳，一步一步，石阶在雨里泛着冷光，他盯着脚前面那半尺石面，看石面上水纹往哪边流，水往低处流，脚就往水来的方向踩，踩实了再换另一只。